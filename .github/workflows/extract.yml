name: Extract uploaded zip
on:
  push:
    paths: ['**.zip']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project and commit
        run: |
          set -e
          z=$(ls *.zip | head -1)
          mkdir -p /tmp/x && unzip -q "$z" -d /tmp/x
          git rm -q "$z"
          src=/tmp/x; [ -d /tmp/x/dss_op ] && src=/tmp/x/dss_op
          cp -a "$src"/. .
          find . -name __pycache__ -type d -prune -exec rm -rf {} +
          printf 'pulp==2.9.0\nnumpy\npandas\nstatsmodels\nmatplotlib\n' > requirements.txt
          printf '__pycache__/\n*.py[cod]\n.venv/\nvenv/\n.ipynb_checkpoints/\n.DS_Store\n*.lp\n*.mps\n' > .gitignore
          chmod +x run_pipeline.sh || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add project files: DSS Order Promising (Framinan et al., 2024)"
          git push
